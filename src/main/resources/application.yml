server:
  port: 8086

spring:
  application:
    name: history
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:payments}
    password: ${DB_PASSWORD:payments}
    # search_path соединения — своя схема (создаётся в infra/postgres/init.sql)
    hikari:
      schema: history
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: history
    liquibase-schema: history
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:29092}
    consumer:
      group-id: history
      # Новая группа читает топик с начала — подтянем и платежи, прошедшие до запуска сервиса
      auto-offset-reset: earliest
    listener:
      # По потоку на партицию топика
      concurrency: ${KAFKA_LISTENER_CONCURRENCY:3}

# Общая библиотека libs/platform
platform:
  # Сообщения, не обработанные после повторов, — в DLT своей группы (payment.events.<группа>-dlt); разбор:
  # GET /api/internal/dlt/payment.events (сколько ждёт), POST /api/internal/dlt/payment.events/replay (отправить снова)
  kafka:
    dead-letter:
      topics: [payment.events]
      groups: [history]
  # Swagger: описание API и коды ошибок в схеме Problem
  openapi:
    description: "История операций и аналитика"
    error-codes: com.paymentsapp.history.error.HistoryError
  time:
    zone: Europe/Moscow

messaging:
  payment-events:
    topic: payment.events

history:
  # Длина пометки операции — по колонке operations.details (длинное назначение платежа обрезаем с «…»)
  details-max: 100
  # Лента: сколько операций на странице по умолчанию и не больше скольких
  page:
    default-size: 20
    max-size: 100

# Actuator: /actuator/health — liveness (процесс жив) и readiness (готов принимать запросы: есть БД и Redis);
# по ним healthcheck в compose и пробы Kubernetes. Остановка — плавная (по умолчанию в Spring Boot): новые запросы
# не принимаем, текущие дорабатывают
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

springdoc:
  # Swagger UI и спецификация включены; в проде можно выключить: SWAGGER_ENABLED=false
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
